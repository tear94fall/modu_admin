# 백오피스 정적 서빙 + 게이트웨이 프록시.
# 브라우저는 같은 출처만 부르므로 게이트웨이 CORS 설정 없이 동작한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 게이트웨이 라우트 prefix 만 넘긴다. 나머지는 SPA 라우팅.
    location ~ ^/(auth-service|member-service|chat-service|push-service|storage-service|commerce-service)/ {
        proxy_pass http://gateway-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 브라우저는 같은 출처 요청에도 Origin 을 붙인다. 게이트웨이 CORS 는 개발 서버 출처만 허용하므로
        # 그대로 넘기면 403 이 난다. 프록시가 같은 출처를 보장하니 Origin 은 지우고 넘긴다.
        proxy_set_header Origin "";
        proxy_read_timeout 60s;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시해도 된다.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
