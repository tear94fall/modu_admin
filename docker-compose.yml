# 모두의 콘솔 세 개를 도커로 띄운다. 게이트웨이와 같은 external 네트워크(modu-infra)에 붙어 컨테이너 이름으로 프록시한다.
# 먼저 modu_infra, modu_platform(gateway-service) 이 떠 있어야 한다(떠 있지 않아도 nginx 는 기동하고, 게이트웨이가 뜨면 붙는다).
services:
  # 기존 백오피스(회원·채팅·그로스·커머스 운영). 독립 패키지라 자기 디렉터리가 컨텍스트다.
  modu-admin:
    build: ./modu-admin
    container_name: modu-admin
    ports:
      - "${ADMIN_PORT:-8081}:80"
    networks:
      - modu-infra
    restart: unless-stopped

  # 시스템 운영 콘솔(게이트웨이 설정 조회 등). 공통 패키지를 쓰므로 레포 루트가 컨텍스트다.
  modu-system:
    build:
      context: .
      dockerfile: modu-system/Dockerfile
    container_name: modu-system
    ports:
      - "${SYSTEM_PORT:-8084}:80"
    networks:
      - modu-infra
    restart: unless-stopped

  # 사내 업무 콘솔(회원 조회, 직원 관리 예정).
  modu-internal:
    build:
      context: .
      dockerfile: modu-internal/Dockerfile
    container_name: modu-internal
    ports:
      - "${INTERNAL_PORT:-8085}:80"
    networks:
      - modu-infra
    restart: unless-stopped

networks:
  modu-infra:
    external: true
