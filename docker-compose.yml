# 모두의 콘솔 세 개를 도커로 띄운다. 게이트웨이와 같은 external 네트워크(modu-infra)에 붙어 컨테이너 이름으로 프록시한다.
# 먼저 modu_infra, modu_platform(gateway-service) 이 떠 있어야 한다(떠 있지 않아도 nginx 는 기동하고, 게이트웨이가 뜨면 붙는다).
# 모든 컨테이너 로그 줄에 compose 서비스·프로젝트 이름을 붙인다(json-file attrs). OTel Collector 가 container 필드와 앱/인프라 인덱스 구분에 쓴다(modu_infra monitoring).
#
# 이미지: GitHub Actions(.github/workflows/images.yml)가 develop/master 푸시마다 같은 Dockerfile 로 빌드해 GHCR 에 올린다.
#   docker compose pull && docker compose up -d   → CI 이미지(ghcr.io/tear94fall/modu-admin/<console>:${IMAGE_TAG:-develop})
#   docker compose up -d --build                  → 로컬 빌드(같은 Dockerfile, 이미지 이름도 같다)
# IMAGE_TAG 로 특정 커밋(develop-<sha7>, master-<sha7>)이나 latest(master) 를 고른다. 자세한 건 README "이미지와 배포".
x-logging: &logging
  driver: json-file
  options:
    labels: com.docker.compose.service,com.docker.compose.project
    max-size: "50m"
    max-file: "3"

# 컨테이너 메모리 제한. JVM 은 -XX:MaxRAMPercentage=75 로 이 안에서 힙을 잡는다(1g → 힙 최대 768MiB).
# k8s 의 resources.requests(mem_reservation)/limits(mem_limit) 와 같은 값으로 매니페스트에 옮긴다.
x-jvm-resources: &jvm-resources
  mem_limit: 1g
  mem_reservation: 512m
x-small-resources: &small-resources
  mem_limit: 64m
  mem_reservation: 16m

services:
  # 기존 백오피스(회원·채팅·그로스·커머스 운영). 독립 패키지라 자기 디렉터리가 컨텍스트다.
  modu-admin:
    image: ghcr.io/tear94fall/modu-admin/modu-admin:${IMAGE_TAG:-develop}
    build: ./modu-admin
    container_name: modu-admin
    logging: *logging
    <<: *small-resources
    ports:
      - "${ADMIN_PORT:-8081}:80"
    networks:
      - modu-infra
    # nginx 가 정적 파일을 내주는지만 본다(게이트웨이 상태와 무관). nginx:1.27-alpine 에 curl 이 있다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  # 시스템 운영 콘솔(게이트웨이 설정 조회 등). 공통 패키지를 쓰므로 레포 루트가 컨텍스트다.
  modu-system:
    image: ghcr.io/tear94fall/modu-admin/modu-system:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: modu-system/Dockerfile
    container_name: modu-system
    logging: *logging
    <<: *small-resources
    ports:
      - "${SYSTEM_PORT:-8084}:80"
    networks:
      - modu-infra
    # nginx 가 정적 파일을 내주는지만 본다(게이트웨이 상태와 무관). nginx:1.27-alpine 에 curl 이 있다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  # 사내 업무 콘솔(회원 조회, 직원 관리 예정).
  modu-internal:
    image: ghcr.io/tear94fall/modu-admin/modu-internal:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: modu-internal/Dockerfile
    container_name: modu-internal
    logging: *logging
    <<: *small-resources
    ports:
      - "${INTERNAL_PORT:-8085}:80"
    networks:
      - modu-infra
    # nginx 가 정적 파일을 내주는지만 본다(게이트웨이 상태와 무관). nginx:1.27-alpine 에 curl 이 있다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  modu-infra:
    external: true
